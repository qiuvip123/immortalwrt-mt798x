name: Build KOMI-A31 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: padavanonly/immortalwrt-mt798x
          ref: openwrt-21.02

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses-dev zlib1g-dev gawk gettext unzip file python3 wget curl git rsync squashfs-tools device-tree-compiler

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure KOMI-A31
        run: |
          cp -f defconfig/mt7981-ax3000-mtwifi-cfg.config .config
          make defconfig

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: komi-a31-firmware
          path: |
            bin/targets/mediatek/mt7981/*initramfs*.bin
            bin/targets/mediatek/mt7981/*squashfs*.bin
          if-no-files-found: error
