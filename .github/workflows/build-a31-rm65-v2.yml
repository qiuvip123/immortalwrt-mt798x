name: build-a31-rm65-v2-easymesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone rm65 source (dev branch, scq330, with retry)
        run: |
          n=0
          until git clone --depth 1 -b dev https://gitee.com/shenyachuan/rm65.git .; do
            n=$((n+1))
            [ $n -ge 6 ] && echo "CLONE_FAILED after 6 tries" && exit 1
            echo "clone attempt $n failed, retrying in 15s..."
            sleep 15
          done
          git log --oneline -1

      - name: Move tree to short path (fix mt_wifi LD ARG_MAX E2BIG; getcwd resolves symlinks)
        run: |
          sudo mkdir -p /x
          sudo mv "$GITHUB_WORKSPACE" /x/ws
          sudo ln -s /x/ws "$GITHUB_WORKSPACE"
          cd /x/ws && git rev-parse --short HEAD && ls feeds.conf.default

      - name: Patch feeds.conf.default (drop mtk feed requiring git01 auth)
        run: |
          cd /x/ws
          sed -i '/mtk_openwrt_feed/d' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        run: |
          cd /x/ws
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add A31 device tree (mt7981-konka-komi-a31.dts)
        run: |
          cd /x/ws
          echo '