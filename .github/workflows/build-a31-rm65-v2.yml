name: build-a31-rm65-v2-easymesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone rm65 source (dev branch, scq330, with retry)
        run: |
          n=0
          until git clone --depth 1 -b dev https://gitee.com/shenyachuan/rm65.git .; do
            n=$((n+1))
            [ $n -ge 6 ] && echo "CLONE_FAILED after 6 tries" && exit 1
            echo "clone attempt $n failed, retrying in 15s..."
            sleep 15
          done
          git log --oneline -1

      - name: Move tree to short path (fix mt_wifi LD ARG_MAX E2BIG; getcwd resolves symlinks)
        run: |
          sudo mkdir -p /x
          sudo mv "$GITHUB_WORKSPACE" /x/ws
          sudo ln -s /x/ws "$GITHUB_WORKSPACE"
          cd /x/ws && git rev-parse --short HEAD && ls feeds.conf.default

      - name: Fetch A31 v2 aux files (a31-v2 dir in this repo)
        run: |
          mkdir -p /tmp/aux
          base="https://raw.githubusercontent.com/qiuvip123/immortalwrt-mt798x/openwrt-21.02/a31-v2"
          for f in mt7981-konka-komi-a31.dts mt7981.mk.append patch_net.py patch_plat.py nf_options.txt stubs.txt fmsh.c apply_fmsh.py patch_mtwifi.py config.diff uci-defaults-99-a31-custom hotplug-99-pppoe-ipv6-hnat; do
            wget -q "$base/$f" -O "/tmp/aux/$f" || curl -fsSL "$base/$f" -o "/tmp/aux/$f"
            ls -l "/tmp/aux/$f"
          done

      - name: Patch feeds.conf.default (drop mtk feed requiring git01 auth)
        run: |
          cd /x/ws
          sed -i '/mtk_openwrt_feed/d' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        run: |
          cd /x/ws
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add A31 device support (dts, mt7981.mk, 02_network, platform.sh, NF options)
        run: |
          cd /x/ws
          cp /tmp/aux/mt7981-konka-komi-a31.dts target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-konka-komi-a31.dts
          cat /tmp/aux/mt7981.mk.append >> target/linux/mediatek/image/mt7981.mk
          python3 /tmp/aux/patch_net.py
          python3 /tmp/aux/patch_plat.py
          cat /tmp/aux/nf_options.txt >> target/linux/mediatek/mt7981/config-5.4
          grep -n 'komi-a31' target/linux/mediatek/mt7981/base-files/etc/board.d/02_network target/linux/mediatek/mt7981/base-files/lib/upgrade/platform.sh target/linux/mediatek/image/mt7981.mk | head

      - name: Remove IPsec (IP安全) menu from luci-app-mtk
        run: |
          cd /x/ws
          rm -f package/mtk/applications/luci-app-mtk/luasrc/controller/ipsec.lua
          rm -f package/mtk/applications/luci-app-mtk/luasrc/view/admin_mtk/mtk_ipsec_view.htm
          echo "controllers now:"
          ls package/mtk/applications/luci-app-mtk/luasrc/controller/

      - name: Add luci-app-mtk-dash2 (Chinese EasyMesh/WiFi UI, yyyyy114514)
        run: |
          cd /x/ws
          wget -q https://codeload.github.com/yyyyy114514/luci-app-mtk-dash2/tar.gz/refs/heads/main -O /tmp/dash2.tgz
          mkdir -p package/luci-app-mtk-dash2
          tar -xzf /tmp/dash2.tgz -C package/luci-app-mtk-dash2 --strip-components=1
          ls package/luci-app-mtk-dash2/

      - name: Add luci-theme-argon v2.2.5 (OpenWrt 21.02 compatible)
        run: |
          cd /x/ws
          wget -q https://codeload.github.com/jerrykuku/luci-theme-argon/tar.gz/refs/tags/v2.2.5 -O /tmp/argon.tgz
          mkdir -p package/luci-theme-argon
          tar -xzf /tmp/argon.tgz -C package/luci-theme-argon --strip-components=1
          ls package/luci-theme-argon/

      - name: Add files overlay (uci-defaults + hotplug)
        run: |
          cd /x/ws
          mkdir -p files/etc/uci-defaults files/etc/hotplug.d/iface
          cp /tmp/aux/uci-defaults-99-a31-custom files/etc/uci-defaults/99-a31-custom
          cp /tmp/aux/hotplug-99-pppoe-ipv6-hnat files/etc/hotplug.d/iface/99-pppoe-ipv6-hnat
          chmod 0755 files/etc/uci-defaults/99-a31-custom files/etc/hotplug.d/iface/99-pppoe-ipv6-hnat
          cat files/etc/uci-defaults/99-a31-custom

      - name: Preserve MTK EasyMesh config on sysupgrade
        run: |
          cd /x/ws
          F=$(find package/base-files -name sysupgrade.conf 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            for c in mapd wappd 1905d datconf bndstrg mtkhnat; do
              grep -q "/etc/config/$c" "$F" || echo "/etc/config/$c" >> "$F"
            done
            grep -E 'mapd|wappd|1905d|datconf|bndstrg|mtkhnat' "$F"
          else
            echo "WARN: sysupgrade.conf not found under package/base-files"
          fi

      - name: Prepare kernel source (apply all backport/pending/platform patches)
        run: |
          cd /x/ws
          make target/linux/prepare V=s 2>&1 | tail -60
          echo "--- kernel dirs ---"
          ls -d build_dir/target-*/linux-mediatek_mt7981/linux-5.4.238

      - name: Add mt_wifi nat symbol stubs (kernel source)
        run: |
          cd /x/ws
          KD=$(ls -d build_dir/target-*/linux-mediatek_mt7981/linux-5.4.238 | head -1)
          cat /tmp/aux/stubs.txt >> "$KD/drivers/net/ethernet/mediatek/mtk_eth_soc.c"
          tail -6 "$KD/drivers/net/ethernet/mediatek/mtk_eth_soc.c"

      - name: Inject FM25S01A (FudanMicro) SPI-NAND support into kernel source
        run: |
          cd /x/ws
          KD=$(ls -d build_dir/target-*/linux-mediatek_mt7981/linux-5.4.238 | head -1)
          python3 /tmp/aux/apply_fmsh.py "$KD" /tmp/aux/fmsh.c
          grep -c fmsh "$KD/drivers/mtd/nand/spi/core.c" "$KD/include/linux/mtd/spinand.h" "$KD/drivers/mtd/nand/spi/Makefile"
          ls -l "$KD/drivers/mtd/nand/spi/fmsh.c"

      - name: Configure (.config + make defconfig)
        run: |
          cd /x/ws
          cp /tmp/aux/config.diff .config
          echo 'CONFIG_PACKAGE_luci-app-mtk-dash2=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          make defconfig
          grep -E 'konka_komi-a31|kmod-mt_wifi|luci-app-mtk|mapd|wappd|1905daemon|libmapd|bndstrg|wificonf|dash2|argon|zh-cn' .config

      - name: Patch mt_wifi tarball (fix pChipCap EMI MTWF_DBG use)
        run: |
          cd /x/ws
          python3 /tmp/aux/patch_mtwifi.py
          ls -l dl/mt79xx_20220907-8b55f5.tar.xz

      - name: Build
        run: |
          cd /x/ws
          ulimit -s 65536
          echo "ARG_MAX=$(getconf ARG_MAX) env_bytes=$(env | wc -c) PWD=$PWD"
          set -o pipefail
          # full env reset to stay far below kernel ARG_MAX (mt_wifi aggregate compile cmd is huge)
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/runner             make -j$(nproc) V=s 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        id: check
        run: |
          cd /x/ws
          if ls bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin >/dev/null 2>&1; then
            echo "BUILD_OK"
            echo "--- v2 packages ---"
            ls -l bin/packages/*/luci/*dash2*.ipk bin/packages/*/luci/*argon*.ipk 2>/dev/null || true
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD_FAILED - errors:"
            grep -n -i -E "error:|Error [0-9]|failed to build|FAILED|patch.*failed|Hunk|fatal|No such file|cannot|undefined" build.log | tail -100
            echo "---- last 100 lines ----"
            tail -100 build.log
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a31-rm65-v2-firmware
          path: |
            /x/ws/bin/targets/mediatek/mt7981/*konka_komi-a31-initramfs*.bin
            /x/ws/bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-factory*.bin
            /x/ws/bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin
            /x/ws/bin/packages/*/luci/luci-app-mtk-dash2*.ipk
            /x/ws/bin/packages/*/luci/luci-theme-argon*.ipk
            /x/ws/build.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.check.outputs.ok == 'false'
        run: exit 1
