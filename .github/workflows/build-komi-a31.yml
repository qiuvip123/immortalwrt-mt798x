      - name: Add extra LuCI apps (ramfree)
        run: |
          git clone --depth 1 https://github.com/sbwml/luci-app-ramfree.git package/luci-app-ramfree
          ls -l package/luci-app-ramfree/Makefile

      - name: Bake Tailscale static binaries
        run: |
          mkdir -p files/usr/sbin files/etc/init.d
          curl -fsSL -o /tmp/tailscale.tgz https://pkgs.tailscale.com/stable/tailscale_1.104.2_arm64.tgz
          tar -xzf /tmp/tailscale.tgz -C /tmp
          cp /tmp/tailscale_1.104.2_arm64/tailscale /tmp/tailscale_1.104.2_arm64/tailscaled files/usr/sbin/
          chmod +x files/usr/sbin/tailscale files/usr/sbin/tailscaled
          echo '' | tr -d ' ' | base64 -d > files/etc/init.d/tailscaled
          chmod +x files/etc/init.d/tailscaled
          ls -l files/usr/sbin files/etc/init.d

      - name: Add custom luci-app-tailscale Lua GUI
        run: |
          mkdir -p files/usr/lib/lua/luci/controller files/usr/lib/lua/luci/view/tailscale
          echo '' | tr -d ' ' | base64 -d > files/usr/lib/lua/luci/controller/tailscale.lua
          echo '' | tr -d ' ' | base64 -d > files/usr/lib/lua/luci/view/tailscale/status.htm
          chmod 644 files/usr/lib/lua/luci/controller/tailscale.lua files/usr/lib/lua/luci/view/tailscale/status.htm
          ls -l files/usr/lib/lua/luci/controller/tailscale.lua files/usr/lib/lua/luci/view/tailscale/status.htm

      - name: Configure
        run: |
          cp -f defconfig/mt7981-ax3000-mtwifi-cfg.config .config
          echo 'CONFIG_PACKAGE_luci-app-filetransfer=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ramfree=y' >> .config
          make defconfig
          grep -E 'konka_komi-a31|luci-app-filetransfer|luci-app-ttyd|ttyd|luci-app-ramfree|luci-app-turboacc-mtk|mtwifi-cfg' .config

      - name: Apply LAN IP / open WiFi / empty root password
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.2.1'
          uci commit network
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-iface[0].encryption='none'
          uci delete wireless.@wifi-iface[0].key 2>/dev/null || true
          uci commit wireless
          passwd -d root
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom
          ls -l files/etc/uci-defaults/

      - name: Build
        run: |
          ulimit -s 65536
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        id: check
        run: |
          if ls bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin >/dev/null 2>&1; then
            echo "BUILD_OK"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD_FAILED - errors:"
            grep -n -i -E "error:|Error [0-9]|failed to build|FAILED|patch.*failed|Hunk|fatal|No such file|cannot|undefined" build.log | tail -80
            echo "---- last 80 lines ----"
            tail -80 build.log
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: komi-a31-firmware-fmsh
          path: |
            bin/targets/mediatek/mt7981/*konka_komi-a31-initramfs*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-factory*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin
            build.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.check.outputs.ok == 'false'
        run: exit 1
