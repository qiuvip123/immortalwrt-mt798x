name: build-a31-rm65-easymesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone rm65 source (dev branch, scq330)
        run: |
          git clone --depth 1 -b dev https://gitee.com/shenyachuan/rm65.git .
          git log --oneline -1
          ls

      - name: Patch feeds.conf.default (drop mtk feed requiring git01 auth)
        run: |
          sed -i '/mtk_openwrt_feed/d' feeds.conf.default
          echo '--- feeds.conf.default ---'
          cat feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add A31 device tree (mt7981-konka-komi-a31.dts)
        run: |
          echo '' | base64 -d > target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-konka-komi-a31.dts
          ls -l target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-konka-komi-a31.dts

      - name: Add A31 image definition (mt7981.mk)
        run: |
          cat >> target/linux/mediatek/image/mt7981.mk <<'MK'

define Device/konka_komi-a31
  DEVICE_VENDOR := KONKA
  DEVICE_MODEL := KOMI A31
  DEVICE_DTS := mt7981-konka-komi-a31
  DEVICE_DTS_DIR := $(DTS_DIR)/mediatek
  SUPPORTED_DEVICES := konka,komi-a31
  UBINIZE_OPTS := -E 5
  BLOCKSIZE := 128k
  PAGESIZE := 2048
  IMAGE_SIZE := 114688k
  KERNEL_IN_UBI := 1
  IMAGES += factory.bin
  IMAGE/factory.bin := append-ubi | check-size $$$$(IMAGE_SIZE)
  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
endef
TARGET_DEVICES += konka_komi-a31
MK
          grep -A 20 'define Device/konka_komi-a31' target/linux/mediatek/image/mt7981.mk

      - name: Add A31 network config (02_network)
        run: |
          python3 - <<'PY'
p = 'target/linux/mediatek/mt7981/base-files/etc/board.d/02_network'
s = open(p).read()
net_case = '''	*konka,komi-a31*)
		ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" wan
		;;
'''.replace('\\t', '\t')
anchor = '\t*)'
idx = s.find(anchor)
assert idx > 0, 'default case not found'
s = s[:idx] + net_case + s[idx:]
open(p, 'w').write(s)
print('02_network patched')
PY
          grep -n 'komi-a31' target/linux/mediatek/mt7981/base-files/etc/board.d/02_network

      - name: Add A31 sysupgrade support (platform.sh)
        run: |
          python3 - <<'PY'
p = 'target/linux/mediatek/mt7981/base-files/lib/upgrade/platform.sh'
s = open(p).read()
# platform_do_upgrade: add A31 -> nand_do_upgrade
old_up = '''\t*snand*)
\t\tubi_do_upgrade "$1"
\t\t;;'''
new_up = '''\t*konka,komi-a31*)
\t\tnand_do_upgrade "$1"
\t\t;;
\t*snand*)
\t\tubi_do_upgrade "$1"
\t\t;;'''
assert old_up in s, 'upgrade anchor missing'
s = s.replace(old_up, new_up)
# platform_check_image: add A31 to ustar branch
old_ck = '''\t*snand* |\\
\t*emmc*)'''
new_ck = '''\t*konka,komi-a31* |\\
\t*snand* |\\
\t*emmc*)'''
assert old_ck in s, 'check anchor missing'
s = s.replace(old_ck, new_ck)
open(p, 'w').write(s)
print('platform.sh patched')
PY
          grep -n 'komi-a31' target/linux/mediatek/mt7981/base-files/lib/upgrade/platform.sh

      - name: Add FM25S01A (FudanMicro) SPI-NAND support patch
        run: |
          echo '' | base64 -d > target/linux/mediatek/patches-5.4/494-mtd-spinand-add-support-fmsh.patch
          ls -l target/linux/mediatek/patches-5.4/494-mtd-spinand-add-support-fmsh.patch

      - name: Configure (.config + make defconfig)
        run: |
          cat > .config <<'CFG'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7981=y
CONFIG_TARGET_mediatek_mt7981_DEVICE_konka_komi-a31=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-app-mtk=y
CONFIG_PACKAGE_kmod-mt_wifi=y
CONFIG_PACKAGE_wifi-profile=y
CONFIG_PACKAGE_mapd=y
CONFIG_PACKAGE_wappd=y
CONFIG_PACKAGE_1905daemon=y
CONFIG_PACKAGE_libmapd=y
CONFIG_PACKAGE_bndstrg_plus=y
CONFIG_PACKAGE_wificonf=y
CONFIG_PACKAGE_ttyd=y
CFG
          make defconfig
          grep -E 'konka_komi-a31|kmod-mt_wifi|luci-app-mtk|mapd|wappd|1905daemon|libmapd|bndstrg|wificonf' .config

      - name: Build
        run: |
          ulimit -s 65536
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        id: check
        run: |
          if ls bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin >/dev/null 2>&1; then
            echo "BUILD_OK"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD_FAILED - errors:"
            grep -n -i -E "error:|Error [0-9]|failed to build|FAILED|patch.*failed|Hunk|fatal|No such file|cannot|undefined" build.log | tail -80
            echo "---- last 80 lines ----"
            tail -80 build.log
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a31-rm65-easymesh-firmware
          path: |
            bin/targets/mediatek/mt7981/*konka_komi-a31-initramfs*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-factory*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin
            build.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.check.outputs.ok == 'false'
        run: exit 1
