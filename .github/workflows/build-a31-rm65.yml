name: build-a31-rm65-easymesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl

      - name: Clone rm65 source (dev branch, scq330, with retry)
        run: |
          n=0
          until git clone --depth 1 -b dev https://gitee.com/shenyachuan/rm65.git .; do
            n=$((n+1))
            [ $n -ge 6 ] && echo "CLONE_FAILED after 6 tries" && exit 1
            echo "clone attempt $n failed, retrying in 15s..."
            sleep 15
          done
          git log --oneline -1

      - name: Patch feeds.conf.default (drop mtk feed requiring git01 auth)
        run: |
          sed -i '/mtk_openwrt_feed/d' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add A31 device tree (mt7981-konka-komi-a31.dts)
        run: |
          echo '' | base64 -d > target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-konka-komi-a31.dts
          ls -l target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-konka-komi-a31.dts

      - name: Add A31 image definition (mt7981.mk)
        run: |
          echo '' | base64 -d >> target/linux/mediatek/image/mt7981.mk
          grep -A 20 'define Device/konka_komi-a31' target/linux/mediatek/image/mt7981.mk

      - name: Add A31 network config (02_network)
        run: |
          echo '' | base64 -d > /tmp/patch_net.py
          python3 /tmp/patch_net.py
          grep -n 'komi-a31' target/linux/mediatek/mt7981/base-files/etc/board.d/02_network

      - name: Add A31 sysupgrade support (platform.sh)
        run: |
          echo '' | base64 -d > /tmp/patch_plat.py
          python3 /tmp/patch_plat.py
          grep -n 'komi-a31' target/linux/mediatek/mt7981/base-files/lib/upgrade/platform.sh

      - name: Prepare kernel source (apply all backport/pending/platform patches)
        run: |
          make target/linux/prepare V=s 2>&1 | tail -60
          echo "--- kernel dirs ---"
          ls -d build_dir/target-*/linux-mediatek_mt7981/linux-5.4.238

      - name: Inject FM25S01A (FudanMicro) SPI-NAND support into kernel source
        run: |
          echo '' | base64 -d > /tmp/apply_fmsh.py
          KD=$(ls -d build_dir/target-*/linux-mediatek_mt7981/linux-5.4.238 | head -1)
          echo "KD=$KD"
          sed -n '750,768p' "$KD/drivers/mtd/nand/spi/core.c"
          python3 /tmp/apply_fmsh.py "$KD"
          grep -c fmsh "$KD/drivers/mtd/nand/spi/core.c" "$KD/include/linux/mtd/spinand.h" "$KD/drivers/mtd/nand/spi/Makefile"
          ls -l "$KD/drivers/mtd/nand/spi/fmsh.c"

      - name: Configure (.config + make defconfig)
        run: |
          echo '' | base64 -d > .config
          make defconfig
          grep -E 'konka_komi-a31|kmod-mt_wifi|luci-app-mtk|mapd|wappd|1905daemon|libmapd|bndstrg|wificonf' .config

      - name: Build
        run: |
          ulimit -s 65536
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        id: check
        run: |
          if ls bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin >/dev/null 2>&1; then
            echo "BUILD_OK"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD_FAILED - errors:"
            grep -n -i -E "error:|Error [0-9]|failed to build|FAILED|patch.*failed|Hunk|fatal|No such file|cannot|undefined" build.log | tail -80
            echo "---- last 80 lines ----"
            tail -80 build.log
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a31-rm65-easymesh-firmware
          path: |
            bin/targets/mediatek/mt7981/*konka_komi-a31-initramfs*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-factory*.bin
            bin/targets/mediatek/mt7981/*konka_komi-a31-squashfs-sysupgrade*.bin
            build.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.check.outputs.ok == 'false'
        run: exit 1
